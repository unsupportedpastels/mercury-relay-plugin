name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest==9.0.3 pyyaml==6.0.3 ruff==0.16.5
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest -q --ignore=tests/integration
      - name: Vectors match the schema and manifests
        run: python -m pytest -q tests/test_framing_vectors.py tests/test_secure_channel_vectors.py
