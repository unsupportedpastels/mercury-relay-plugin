[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "mercury-relay-plugin"
version = "0.2.5"
description = "Server-side Hermes plugin foundation for Mercury Relay"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography==50.0.1",
]

[dependency-groups]
dev = [
  "pip-audit==2.10.0",
  "pytest==9.0.3",
  "pyyaml==6.0.3",
  "ruff==0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mercury_relay_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
# Vendored dependencies ship verbatim and are never linted or reformatted.
extend-exclude = ["src/mercury_relay_plugin/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
